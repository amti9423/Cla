<!doctype html>
<!-- Źródło ikony Tempo: szklany pomidor (pomodoro) na tarczy czasu.
     Wektor 1024×1024, renderowany do icon-180.png i icon-512.png. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
svg{display:block;width:100vw;height:100vw}
</style></head><body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3E2558"/><stop offset=".55" stop-color="#1D1429"/><stop offset="1" stop-color="#0D0B14"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF8FAB" stop-opacity=".75"/><stop offset="1" stop-color="#FF8FAB" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowApri" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB48A" stop-opacity=".6"/><stop offset="1" stop-color="#FFB48A" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowLila" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7B66E8" stop-opacity=".6"/><stop offset="1" stop-color="#7B66E8" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9BB5"/><stop offset="1" stop-color="#FFBE94"/></linearGradient>
    <radialGradient id="tomato" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#FFD0BC"/><stop offset=".28" stop-color="#FF9AA8"/><stop offset=".7" stop-color="#F0607F"/><stop offset="1" stop-color="#B83A66"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FF0C8"/><stop offset="1" stop-color="#2FAE84"/></linearGradient>
    <radialGradient id="bounce" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#FFE2D2" stop-opacity=".55"/><stop offset="1" stop-color="#FFE2D2" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <!-- tło z poświatą, jak w aplikacji -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="170" cy="150" r="420" fill="url(#glowRose)"/>
  <circle cx="900" cy="930" r="440" fill="url(#glowApri)"/>
  <circle cx="860" cy="260" r="360" fill="url(#glowLila)"/>

  <!-- tarcza: tor, kreski minut, łuk pozostałego czasu z poświatą -->
  <circle cx="512" cy="528" r="392" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="40"/>
  <g stroke="#fff" stroke-linecap="round" opacity=".45">
    <g id="ticks"></g>
  </g>
  <circle cx="512" cy="528" r="392" fill="none" stroke="url(#arc)" stroke-width="56" stroke-linecap="round" opacity=".55" filter="url(#soft)"
          stroke-dasharray="2463" stroke-dashoffset="616" transform="rotate(-90 512 528)"/>
  <circle cx="512" cy="528" r="392" fill="none" stroke="url(#arc)" stroke-width="40" stroke-linecap="round"
          stroke-dasharray="2463" stroke-dashoffset="616" transform="rotate(-90 512 528)"/>
  <circle cx="120" cy="528" r="30" fill="#FF9BB5" opacity=".45" filter="url(#soft)"/>
  <circle cx="120" cy="528" r="17" fill="#FFF7FA"/>

  <!-- pomidor ze szkła -->
  <ellipse cx="512" cy="760" rx="210" ry="42" fill="#000" opacity=".35" filter="url(#shadow)"/>
  <path d="M512 330c150 0 262 82 262 222 0 142-118 240-262 240S250 694 250 552c0-140 112-222 262-222z" fill="url(#tomato)"/>
  <path d="M512 330c150 0 262 82 262 222 0 142-118 240-262 240S250 694 250 552c0-140 112-222 262-222z" fill="url(#bounce)"/>
  <path d="M430 360c-14 70-14 300 0 410M594 360c14 70 14 300 0 410" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="10"/>
  <ellipse cx="420" cy="430" rx="108" ry="58" transform="rotate(-24 420 430)" fill="url(#spec)"/>
  <circle cx="352" cy="520" r="14" fill="#fff" opacity=".55"/>
  <path d="M512 330c150 0 262 82 262 222 0 142-118 240-262 240S250 694 250 552c0-140 112-222 262-222z" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- szypułka i listki -->
  <g transform="translate(512 338)">
    <path d="M0 0c-36-6-92 6-128 34 44 4 86-2 116-16-26 26-44 60-50 96 34-22 56-54 62-88 6 34 28 66 62 88-6-36-24-70-50-96 30 14 72 20 116 16C92 6 36-6 0 0z" fill="url(#leaf)"/>
    <path d="M0 0c-36-6-92 6-128 34 44 4 86-2 116-16-26 26-44 60-50 96 34-22 56-54 62-88 6 34 28 66 62 88-6-36-24-70-50-96 30 14 72 20 116 16C92 6 36-6 0 0z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <path d="M-4 6c-4-30 4-58 22-80" fill="none" stroke="#5CCB9C" stroke-width="18" stroke-linecap="round"/>
    <path d="M-4 6c-4-30 4-58 22-80" fill="none" stroke="#C9FFE6" stroke-opacity=".5" stroke-width="5" stroke-linecap="round" transform="translate(-4 0)"/>
  </g>
</svg>
<script>
  // 25 kresek minut, co piąta dłuższa — jak na tarczy w aplikacji
  const g = document.getElementById("ticks"), ns = "http://www.w3.org/2000/svg";
  for (let i = 0; i < 25; i++) {
    const a = i / 25 * Math.PI * 2 - Math.PI / 2, major = i % 5 === 0;
    const r1 = major ? 318 : 332, r2 = 350, l = document.createElementNS(ns, "line");
    l.setAttribute("x1", 512 + r1 * Math.cos(a)); l.setAttribute("y1", 528 + r1 * Math.sin(a));
    l.setAttribute("x2", 512 + r2 * Math.cos(a)); l.setAttribute("y2", 528 + r2 * Math.sin(a));
    l.setAttribute("stroke-width", major ? 9 : 5);
    g.appendChild(l);
  }
</script>
</body></html>
