<!doctype html>
<!-- Źródło ikony Tempo (180×180). Renderowane do icon-180.png przez shot.mjs. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0D0B14}
.icon{position:relative;width:180px;height:180px;overflow:hidden;background:#0D0B14}
.icon::before{content:"";position:absolute;inset:-40px;background:
  radial-gradient(70px 70px at 40px 30px,#FF8FAB,transparent),
  radial-gradient(80px 80px at 150px 160px,#FFB48A,transparent),
  radial-gradient(90px 90px at 120px 70px,#3A2A78,transparent);opacity:.75}
svg{position:absolute;inset:0}
</style></head><body>
<div class="icon">
  <svg viewBox="0 0 180 180" width="180" height="180">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8FAB"/><stop offset="1" stop-color="#FFB48A"/></linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
    </defs>
    <circle cx="90" cy="90" r="58" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="12"/>
    <circle cx="90" cy="90" r="58" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="364.4" stroke-dashoffset="91" transform="rotate(-90 90 90)"/>
    <circle cx="90" cy="90" r="40" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.2"/>
    <circle cx="32" cy="90" r="4.5" fill="#F5F0F8"/>
  </svg>
</div>
</body></html>
